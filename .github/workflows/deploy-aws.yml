name: Deploy Production
on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names winterasg \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No in-service instances found in ASG winterasg" >&2
            exit 1
          fi

          echo "Deploying to: $INSTANCE_IDS"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids $INSTANCE_IDS \
            --comment "GitHub Production Deploy" \
            --parameters 'commands=[
              "set -e",
              "export HOME=/root",
              "cd /var/www/winter",
              "git config --system --add safe.directory /var/www/winter || true",
              "git fetch origin",
              "git reset --hard origin/prod",
              "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction",
              "php artisan cache:clear",
              "php artisan config:clear",
              "php artisan view:clear",
              "systemctl reload php-fpm",
              "systemctl reload nginx"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          FAILED=0

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Waiting for command on instance: $INSTANCE_ID"

            while true; do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              echo "[$INSTANCE_ID] Status: $STATUS"

              if [ "$STATUS" = "Success" ]; then
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                break
              fi

              if [ "$STATUS" = "Failed" ] || \
                 [ "$STATUS" = "Cancelled" ] || \
                 [ "$STATUS" = "TimedOut" ]; then
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                FAILED=1
                break
              fi

              sleep 5
            done
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more instances failed to deploy" >&2
            exit 1
          fi

          echo "Deployment succeeded on all instances."
