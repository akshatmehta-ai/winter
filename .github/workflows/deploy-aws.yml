name: Deploy Production

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Role,Values=WinterCMS" \
            --comment "GitHub Production Deploy" \
            --parameters 'commands=[
              "cd /var/www/winter",
              "git config --global --add safe.directory /var/www/winter",
              "git fetch origin",
              "git reset --hard origin/prod",
              "sudo -u nginx composer install --no-dev --optimize-autoloader --no-interaction",
              "sudo -u nginx php artisan migrate --force",
              "sudo -u nginx php artisan cache:clear",
              "sudo -u nginx php artisan config:clear",
              "sudo -u nginx php artisan view:clear",
              "systemctl reload php-fpm",
              "systemctl reload nginx"
            ]'
